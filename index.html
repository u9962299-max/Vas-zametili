<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<style>
    /* Сброс отступов и черный фон */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        width: 100%; height: 100%;
        background: #000;
        overflow: hidden; /* Запрет прокрутки */
        cursor: none; /* Скрываем курсор мыши */
        user-select: none; /* Запрет выделения текста */
    }
    
    /* Видео на весь экран */
    #player {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        width: 100vw; height: 100vh;
        object-fit: cover; /* Заполняет весь экран, обрезая края, если надо */
        background: #000;
        pointer-events: none; /* Запрет кликов по видео */
        outline: none;
    }
</style>
</head>
<body>

<!-- ВАЖНО: Проверь имя файла! Если он называется vid.mov, напиши src="./vid.mov" -->
<video id="player"
    src="./vid.mp4"
    autoplay
    muted
    playsinline
    preload="auto"
    disablepictureinpicture
    disableremoteplayback></video>

<script>
    const v = document.getElementById('player');

    // Отключаем любые элементы управления и звук
    v.controls = false;
    v.loop = false;
    v.muted = true;
    v.volume = 0;
    v.defaultMuted = true;

    // Запрещаем правый клик (контекстное меню)
    document.addEventListener('contextmenu', e => e.preventDefault());

    // Когда видео заканчивается — оно просто замирает на последнем кадре
    v.addEventListener('ended', () => {
        v.pause();
    });

    // Запуск видео
    v.play().catch(() => {});

    // Функция для разворота на весь экран
    function goFullscreen() {
        if (document.fullscreenElement) return;
        const el = document.documentElement;
        if (el.requestFullscreen) {
            el.requestFullscreen().catch(() => {});
        } else if (el.webkitRequestFullscreen) {
            el.webkitRequestFullscreen();
        }
    }

    // Браузеры не дают открывать фуллскрин без действия пользователя.
    // Поэтому мы ждем первого движения мыши, клика или нажатия клавиши.
    ['click', 'touchstart', 'keydown', 'mousemove'].forEach(ev => {
        document.addEventListener(ev, goFullscreen, { once: true });
    });
</script>

</body>
</html>
