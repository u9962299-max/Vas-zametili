<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        width: 100%; height: 100%;
        background: #000;
        overflow: hidden;
        cursor: none;
        user-select: none;
        font-family: monospace;
    }
    #player {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        width: 100vw; height: 100vh;
        object-fit: cover;
        background: #000;
        pointer-events: none;
        outline: none;
    }
    #error-box {
        position: fixed;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        color: #ff0055;
        background: rgba(0,0,0,0.8);
        padding: 20px;
        border: 2px solid #ff0055;
        border-radius: 8px;
        text-align: center;
        display: none;
        z-index: 9999;
        font-size: 18px;
        max-width: 80%;
    }
</style>
</head>
<body>

<!-- Добавлен ?v=2, чтобы браузер не брал старое видео из кэша -->
<video id="player"
    src="./vid.mp4?v=2"
    autoplay
    muted
    playsinline
    preload="auto"
    disablepictureinpicture
    disableremoteplayback></video>

<div id="error-box">Ошибка: Видео не загрузилось.<br>Проверь файл vid.mp4</div>

<script>
    const v = document.getElementById('player');
    const errBox = document.getElementById('error-box');

    v.controls = false;
    v.loop = false;
    v.muted = true;
    v.volume = 0;
    v.defaultMuted = true;

    document.addEventListener('contextmenu', e => e.preventDefault());

    v.addEventListener('ended', () => {
        v.pause();
    });

    // Если браузер не может прочитать видео — показываем ошибку
    v.addEventListener('error', () => {
        errBox.style.display = 'block';
        cursor = 'default';
    });

    v.play().catch(() => {});

    function goFullscreen() {
        if (document.fullscreenElement) return;
        const el = document.documentElement;
        if (el.requestFullscreen) {
            el.requestFullscreen().catch(() => {});
        } else if (el.webkitRequestFullscreen) {
            el.webkitRequestFullscreen();
        }
    }

    ['click', 'touchstart', 'keydown', 'mousemove'].forEach(ev => {
        document.addEventListener(ev, goFullscreen, { once: true });
    });
</script>

</body>
</html>
